<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" role="img" aria-labelledby="t d">
<title id="t">How the main executable was matched, Jul 23 to Oct 10, 2026</title>
<desc id="d">Two charts on one time axis. Top: the share of the main executable's functions and code bytes matched at the end of each day with landings, reaching 30% of functions and 11% of bytes by Aug 10, 57% and 26% by Oct 7, and 100% on Oct 10, with 50 points of code on Oct 8 alone. Bottom: functions landed per day, stacked by what produced the match; Oct 8 and Oct 9 landed 514 and 445, most by agents reading the assembly. No landings for 9 days after Jul 23 and for 52 days after Aug 10.</desc>
